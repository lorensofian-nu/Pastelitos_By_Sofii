<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Pastelitos By Sofii</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand"><span class="brand-icon">🎂</span> Pastelitos By Sofii</a>
    <nav class="mainnav">
      <a href="index.html" data-page="inicio">Inicio</a>
      <a href="pedido.html" data-page="pedido">Tomar pedido</a>
      <a href="admin.html" data-page="admin" id="navAdmin" class="hidden">Admin</a>
      <a href="login.html" data-page="login" id="navLogin">Ingresar</a>
      <a href="#" id="navLogout" class="hidden">Cerrar sesión</a>
    </nav>
  </header>
  <div class="scallop-divider"></div>

  <main class="page-wrap">
    <div class="card">
      <h2>Acceso al panel</h2>
      <p>Inicia sesión para administrar el menú y ver estadísticas de ventas.</p>

      <form id="loginForm">
        <div class="field">
          <label for="user">Usuario</label>
          <input type="text" id="user" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" autocomplete="current-password" required>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">Ingresar</button>
        </div>
      </form>
      <div id="authMsg"></div>
    </div>
  </main>

  <footer>Pastelitos By Sofii · <span>pastelitosbysofii@gmail.com</span></footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pages/login-page.js"></script>
</body>
</html>
